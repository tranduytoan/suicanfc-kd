name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-generate based on app version)'
        required: false
        default: ''
      prerelease:
        description: 'Mark this release as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Configure Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/suicanfc-release.jks
            cat <<EOF > app/keystore.properties
          storeFile=suicanfc-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          else
            echo "Secrets not found! Generating temporary release keystore for build..."
            keytool -genkeypair -v \
              -keystore app/suicanfc-release.jks \
              -alias suicanfc-kd \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass SuicaNfcKd2026Key! \
              -keypass SuicaNfcKd2026Key! \
              -dname "CN=SuicaNFC KD, OU=Mobile, O=Personal, L=Tokyo, ST=Tokyo, C=JP"
            cat <<EOF > app/keystore.properties
          storeFile=suicanfc-release.jks
          storePassword=SuicaNfcKd2026Key!
          keyAlias=suicanfc-kd
          keyPassword=SuicaNfcKd2026Key!
          EOF
          fi

      - name: Build Release APK
        run: ./gradlew :app:assembleDefaultRelease --no-daemon --stacktrace

      - name: Identify Output APK
        id: apk_info
        shell: bash
        run: |
          APK_FILE=$(find app/build/outputs/apk/default/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_info.outputs.apk_name }}
          path: ${{ steps.apk_info.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            # Extract versionName from app/build.gradle.kts
            VER_ID=$(grep -E 'val verId = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            TAG="v${VER_ID:-1.7.4}-${TIMESTAMP}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SuicaNFC KD ${{ steps.release_tag.outputs.tag }}
          files: ${{ steps.apk_info.outputs.apk_path }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
